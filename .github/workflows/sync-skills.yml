name: Sync Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/marketplace.json'

jobs:
  sync:
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sync skills
        run: node .github/scripts/sync-skills.js

      - name: Verify and commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git add -- .claude-plugin/marketplace.json .claude-plugin/plugin.json README.md
          git diff --exit-code --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --quiet -- . ':(exclude).claude-plugin/marketplace.json' ':(exclude).claude-plugin/plugin.json' ':(exclude)README.md'
          if ! git diff --cached --quiet; then
            git -c user.name=Coreybot -c user.email=coreybot+github-actions[bot]@users.noreply.github.com \
              commit -m "chore: sync skills with marketplace.json, plugin.json, and README"
          fi

      - name: Push generated commit
        shell: bash
        env:
          SYNC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            git -c http.followRedirects=false -c credential.helper= \
              -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "username=x-access-token\npassword=%s\n" "$SYNC_TOKEN"; fi; }; f' \
              push "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" HEAD:refs/heads/main
          fi
